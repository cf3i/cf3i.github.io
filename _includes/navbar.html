<nav class="navbar navbar-expand-sm navbar-light fixed-top site-navbar">
  <div class="container-lg">
    <a class="navbar-brand" href="{{ '/' | relative_url }}">
      <strong>{{ site.data.profile.navbar_name }}</strong>
    </a>

    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#siteNavigation" aria-controls="siteNavigation" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="siteNavigation">
      <ul class="navbar-nav ml-auto">
        {% for item in site.data.navigation.pages %}
          <li class="nav-item {% if item.name == page.navbar_title %}active{% endif %}">
            <a class="nav-link" href="{{ item.url | relative_url }}">{{ item.name }}</a>
          </li>
        {% endfor %}
      </ul>
    </div>
  </div>
</nav>
