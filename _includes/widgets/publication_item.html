{% assign item = include.item %}
<article class="publication-item {% if include.last %}publication-item-last{% endif %}">
  <div class="publication-visual {{ item.visual }}" aria-hidden="true">
    <span>{{ item.short_title }}</span>
  </div>

  <div class="publication-content">
    <h3>{{ item.title }}</h3>
    <p class="publication-authors">{% include widgets/author_list.html authors=item.authors %}</p>
    <p class="publication-venue"><i>{{ item.pub }}</i> · {{ item.pub_date }}</p>
    {% if item.abstract %}<p class="publication-abstract">{{ item.abstract }}</p>{% endif %}
    <div class="publication-links">
      {% for link in item.links %}
        <a href="{{ link[1] }}" target="_blank" rel="noopener">{{ link[0] }} <i class="fa-solid fa-arrow-up-right-from-square"></i></a>
      {% endfor %}
    </div>
  </div>
</article>
